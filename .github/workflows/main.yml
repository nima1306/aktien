name: Aktien-Scanner

on:
  schedule:
    - cron: "23 5 * * 1-5"   # Montag bis Freitag, ca. 6:30 Uhr deutscher Zeit
  workflow_dispatch:          # zusätzlich per Knopfdruck startbar

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Pakete installieren
        run: pip install -r requirements.txt
      - name: Aktien bewerten
        env:
          AKTIEN_THREADS: "3"
        run: python aktien.py
      - name: Webseite vorbereiten
        run: |
          mkdir site
          cp aktien_bericht.html site/index.html
          cp icon.png site/
          cp aktien_rangliste.xlsx site/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
