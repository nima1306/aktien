# ===== Aktien-Scanner Einstellungen =====

universum:
  dax: true              # die 40 größten deutschen Aktien
  sp500: true            # die 500 größten US-Aktien
  eigene_liste: []       # zusätzliche Aktien, z. B. [ASML.AS, NOVO-B.CO, MC.PA, NESN.SW]
                         # Ticker wie bei Yahoo Finance: .DE = Xetra, .AS = Amsterdam, .PA = Paris

# Gewichtung der 8 Kategorien. Ausgewogen = alle gleich (1).
# Beispiele: mehr Sicherheit -> stabilitaet: 2, qualitaet: 2
#            Dividende       -> dividende: 3, stabilitaet: 2, wachstum: 0.5
#            Wachstum        -> wachstum: 3, momentum: 2, dividende: 0
gewichte:
  bewertung: 1           # günstig im Vergleich zur Branche (KGV, PEG, Cashflow-Rendite)
  qualitaet: 1           # profitabel und solide finanziert (Rendite, Margen, Schulden)
  wachstum: 1            # Umsatz- und Gewinnwachstum, erwartetes Wachstum
  analysten: 1           # Kursziel-Potenzial und Empfehlungen der Analysten
  momentum: 1            # Kursentwicklung der letzten 12 Monate
  stabilitaet: 1         # geringe Schwankungen und Rückgänge
  nachrichten: 1         # Stimmung der aktuellen Schlagzeilen
  dividende: 1           # Höhe und Nachhaltigkeit der Dividende

filter:
  min_marktkapitalisierung_mrd: 5   # kleinere Firmen werden ausgelassen
  abzug_pro_warnung: 3              # Punktabzug je Warnsignal
  threads: 6                        # gleichzeitige Abrufe (bei Fehlern kleiner stellen, z. B. 3)

bericht:
  top: 30                           # so viele Aktien bekommen eine Detailkarte
  nachrichten_pro_aktie: 5

# ===== Insider-Daten (US: SEC Form 4, Deutschland: BaFin) =====
insider:
  sec_kontakt: "Matt Schulln mattschulln@gmail.com"   # PFLICHT: die SEC verlangt Name + E-Mail im Abruf
  tage: 90                                        # Käufe der letzten X Tage
  max_aktien: 600                                 # so viele US-Aktien werden geprüft

# ===== Video-Bot =====
video:
  modus: liste              # liste = jeden Tag die nächste Aktie aus der Rangliste
                            # insider = jeden Tag die stärkste Insider-Story
  anzahl: 1                 # Aktien pro Tag (jede Aktie gibt ein Video pro Sprache)
  sprachen: [de, en]        # zwei Accounts: dieselben Videos auf Deutsch und Englisch
  stimmen:
    de: de-DE-FlorianMultilingualNeural   # Hörproben: in der App "Stimmen anhören"
    en: en-US-AndrewMultilingualNeural    # Name aus der Hörprobe hier eintragen
  tempo: "+5%"              # Sprechtempo: +0% ruhig, +5% natürlich, +10% zügig
  min_sekunden: 61.5        # TikTok zahlt nur für Videos über 1 Minute
  ziel_sekunden: 68         # länger? dann spricht die Stimme automatisch etwas schneller (max. +15 %)
  serie: true               # "Tag 12" im Video, Titel und Abschluss
  aktuell_bevorzugen: true  # Aktien mit Quartalszahlen in den nächsten Tagen, großem Kurssprung oder Reddit-Trend zuerst
  chart_monate: 6
  musik: musik.mp3          # optional: lizenzfreie Musik als musik.mp3 hochladen, sonst ohne Musik
  musik_lautstaerke: 0.12
  eigene_positionen: []     # Aktien, die du selbst besitzt, z. B. [AAPL, SAP.DE] -> Offenlegung im Video

  # nur Listen-Modus
  liste_top: 150            # die besten X der Rangliste werden nacheinander abgearbeitet
  liste_filter: alle        # oder: ohne_warnungen
  wiederholen_nach_tagen: 180

  # nur Insider-Modus
  min_kaufsumme: 100000     # nur Aktien, bei denen Insider für mind. so viel gekauft haben
  gewicht_scanner: 0.4
  gewicht_insider: 0.6
  gewicht_stimmung: 0.1
  sperre_tage: 14

  archiv_tage: 10           # so lange bleiben Videos in der App

# ===== Sentiment-Radar und deutsche Insider =====
stimmung:
  aktiv: true               # Szene "Was sagt das Netz?" im Video
  reddit: true              # Reddit-Erwähnungen über ApeWisdom (US-Aktien)
  stocktwits: true          # Bullish/Bearish-Anteil auf StockTwits (US-Aktien)
  bafin: true               # Insiderkäufe deutscher Aktien aus der BaFin-Datenbank

# ===== Weitere Themen (nur Deutsch, eigene TikTok-Konten) =====
themen:
  bundesliga:
    aktiv: true             # Spieltag-Rückblick, Vorschau mit Topspiel, Torjäger, Meister- und Abstiegskampf
    serie: true
  ernaehrung:
    aktiv: true             # Zucker- und Protein-Checks beliebter Produkte (Open Food Facts)
    serie: true
